[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jupiter-degen-edge-bot"
version = "1.0.0"
description = "Jupiter Prediction quantitative PAPER/SHADOW learning bot with optional fail-closed LIVE execution"
requires-python = ">=3.11,<3.14"
readme = "README.md"
dependencies = [
  "requests>=2.32,<3",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scipy>=1.13,<2",
  "scikit-learn>=1.5,<2",
  "joblib>=1.4,<2",
  "psutil>=6,<8",
  "rich>=13,<15",
  "python-dotenv>=1.0,<2",
  "typer>=0.12,<1",
  "streamlit>=1.37,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["jupiterdegenbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
